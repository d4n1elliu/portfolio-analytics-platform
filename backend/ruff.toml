# Settings for ruff, the linter. Run "ruff check ." from backend/.
target-version = "py312"
# The width that "ruff format ." wraps lines at.
line-length = 100

[lint]
ignore = [
    # Keep writing Decimal("0"), not Decimal(0).
    "FURB157",
    # The Generic[T] syntax in Page and validate_all is intentional.
    "UP046",
    "UP047",
]

[lint.isort]
# alembic is an installed package, not the local alembic/ folder.
known-third-party = ["alembic"]
# tests/factories.py is imported by the tests as "factories".
known-first-party = ["ai_fakes", "factories"]

[lint.flake8-bugbear]
# FastAPI routes use Depends(...) and Query(...) as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
