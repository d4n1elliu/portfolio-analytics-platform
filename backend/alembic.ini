# Settings for Alembic, the database migration tool.
# Full list of options: https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file

[alembic]
# Folder that holds the migration scripts. %(here)s means "the folder this
# file is in".
script_location = %(here)s/alembic

# Adds backend/ to Python's import path so migrations can import the app
# package (for example "from app.database import Base").
prepend_sys_path = .

# How to split a setting that lists several paths. "os" uses the normal
# separator for the operating system.
path_separator = os

# The database URL is deliberately not set here. alembic/env.py reads it from
# app.config, which loads DATABASE_URL from the environment or backend/.env.


# Logging: what Alembic prints to the terminal when a command runs.
# Change a "level" to INFO or DEBUG to see more detail.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# Set this level to INFO to print every SQL statement that is run.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
