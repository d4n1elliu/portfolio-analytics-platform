# Local PostgreSQL for development and tests. Run from this folder with:
#   docker compose -f docker-compose.dev.yml up -d
#
# It holds two databases: portfolio for the app and portfolio_test for the
# tests. The password is for this machine only. Production stays on Neon.

services:
  db:
    # PostgreSQL with the pgvector extension available.
    image: pgvector/pgvector:0.8.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    # Port 5433 on this machine, so it does not clash with another PostgreSQL
    # on 5432. Only this machine can connect.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs once, when the data volume is first created.
      - ./dev/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
