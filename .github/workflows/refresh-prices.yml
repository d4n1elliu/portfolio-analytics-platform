name: Refresh prices

# Runs on weekdays after the ASX has closed, or when started by hand.
on:
  schedule:
    # 08:23 UTC is after 6pm in Sydney, or 7pm during daylight saving. The ASX
    # closes at 4pm. Not on the hour, when GitHub delays scheduled runs the most.
    - cron: "23 8 * * 1-5"
  workflow_dispatch:

# One refresh at a time. A newer one waits instead of cutting this one off.
concurrency:
  group: refresh-prices
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    name: Refresh prices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements-jobs.txt
      - run: pip install -r requirements-jobs.txt
      # Fails only when no security could be refreshed.
      - name: Fetch and store the latest closing prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m jobs.refresh_prices

      - name: Open an issue for a failed refresh, or comment on the open one
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: The price refresh failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          message="The Refresh prices workflow failed, so the stored prices may be out of date. See $RUN_URL"
          open_issue=$(gh issue list --state open --search "\"$ISSUE_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$message"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$message"
          fi
